<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Плейлист — {{ event.title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">
<div class="container py-4">
    <h1>Финальный плейлист: {{ event.title }}</h1>
    <a href="{% url 'core:event_detail' event.access_code %}" class="btn btn-secondary mb-3">← Назад</a>
    <a href="{% url 'core:download_playlist' event.access_code %}" class="btn btn-outline-secondary mb-3">Скачать .txt</a>
    <!-- Диаграмма жанров -->
    <div class="mb-5">
        <h2>Распределение жанров</h2>
        <canvas id="genreChart" width="400" height="200"></canvas>
        <script>
            const ctx = document.getElementById('genreChart').getContext('2d');

            const genreToTracks = {{ genre_to_tracks|safe }};

            new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: {{ chart_labels|safe }},
                    datasets: [{
                        data: {{ chart_data|safe }},
                        backgroundColor: [
                            '#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF',
                            '#FF9F40', '#8E5EA2', '#37A27F', '#E6773B', '#4D85BD',
                            '#C43A5A', '#7F60A8', '#2E8B57', '#D2691E', '#8B008B'
                        ]
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'top' },
                        tooltip: {
                            callbacks: {
                                afterLabel: function(context) {
                                    const genre = context.label;
                                    const tracks = genreToTracks[genre] || [];
                                    if (tracks.length > 0) {
                                        return '\n' + tracks.join('\n');
                                    }
                                    return '';
                                }
                            }
                        }
                    }
                }
            });
        </script>
    </div>

    <!-- Список треков -->
    <h2>Треки ({{ balanced_suggestions|length }})</h2>
    {% for s in balanced_suggestions %}
        <div class="card mb-2">
            <div class="card-body">
                <h5 class="card-title">{{ s.track.title }}</h5>
                <p class="card-text">{{ s.track.artist }}<br>
                <small class="text-muted">Рейтинг: {{ s.votes_score }}</small></p>
            </div>
        </div>
    {% endfor %}
</div>
</body>
</html>
