<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мои мероприятия — VibeSync</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <h2 class="mb-4">Мои мероприятия</h2>
        <a href="{% url 'core:create_event' %}" class="btn btn-primary mb-3">+ Создать новое</a>

        {% if events %}
            <div class="list-group">
                {% for event in events %}
                    <div class="list-group-item">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h5>{{ event.title }}</h5>
                                <p class="text-muted">{{ event.description|truncatewords:15 }}</p>
                            </div>
                            <div>
                                <a href="{% url 'core:event_detail' event.access_code %}" class="btn btn-sm btn-outline-primary">Открыть</a>
                                <span class="badge bg-secondary ms-2">Код: {{ event.access_code }}</span>
                            </div>
                        </div>
                    </div>
                {% endfor %}
            </div>
        {% else %}
            <p class="text-muted">У вас пока нет мероприятий.</p>
        {% endif %}
    </div>
</body>
</html>
