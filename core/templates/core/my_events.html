<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мои мероприятия — VibeSync</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <a href="{% url 'core:home' %}" class="btn btn-secondary">← Назад в меню</a>
            <h2>Мои мероприятия</h2>
            <a href="{% url 'core:create_event' %}" class="btn btn-primary">+ Создать новое</a>
        </div>

        {% if events %}
            <div class="row">
                {% for event in events %}
                <div class="col-md-6 col-lg-4 mb-4">
                    <div class="card h-100">
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title">{{ event.title }}</h5>
                            <p class="card-text flex-grow-1">{{ event.description|default:"Без описания" }}</p>
                            <div class="mt-auto">
                                <div class="badge bg-secondary mb-2">Код: {{ event.access_code }}</div>
                                <div class="d-grid gap-2">
                                    <a href="{% url 'core:event_detail' event.access_code %}" class="btn btn-sm btn-outline-primary">Открыть</a>
                                    <a href="{% url 'core:final_playlist' event.access_code %}" class="btn btn-sm btn-success">Плейлист</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                {% endfor %}
            </div>
        {% else %}
            <div class="text-center py-5">
                <p class="text-muted">У вас пока нет мероприятий.</p>
                <a href="{% url 'core:create_event' %}" class="btn btn-primary">Создать первое мероприятие</a>
            </div>
        {% endif %}
    </div>
</body>
</html>
