<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VibeSync - Коллективные плейлисты</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5 text-center">
        <h1 class="display-4 mb-4">VibeSync</h1>
        <p class="lead mb-5">Создавайте музыкальные плейлисты вместе с друзьями!</p>

        {% if user.is_authenticated %}
            <div class="d-grid gap-3 d-md-block">
                <p class="text-muted">Вы вошли как {{ user.first_name }}</p>
                <a href="/admin/" class="btn btn-outline-secondary btn-lg">Админка (пока)</a>
            </div>
        {% else %}
            <div class="d-grid gap-3 d-md-flex justify-content-center">
                <a href="{% url 'core:simple_register' %}" class="btn btn-primary btn-lg">Зарегистрироваться</a>
            </div>
        {% endif %}
    </div>
</body>
</html>
